<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ashwin Kumaar B — Portfolio</title>
  <meta name="description" content="Portfolio of Ashwin Kumaar B — AI & Data Science Developer, Flutter & Full-Stack Builder. Explore 3D WebGL scenes, Diabetic Retinopathy AI, JeevaLink (SIH 2026), and hackathon projects." />
  <meta name="author" content="Ashwin Kumaar B" />
  <meta name="theme-color" content="#FFD400" />

  <!-- Favicons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!-- Open Graph / Social Media (LinkedIn, WhatsApp, Slack, Facebook) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ashwin Kumaar B" />
  <meta property="og:title" content="Ashwin Kumaar B — Cinematic Developer Portfolio" />
  <meta property="og:description" content="AI & Data Science, Web & Flutter Developer. Interactive 3D scroll-driven journey exploring Clinical AI, Offline Mesh Comms, and Predictive Telemetry." />
  <meta property="og:image" content="/og-preview.png" />
  <meta property="og:image:secure_url" content="/og-preview.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Ashwin Kumaar B — Portfolio Preview" />

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Ashwin Kumaar B — Cinematic Developer Portfolio" />
  <meta name="twitter:description" content="AI & Data Science, Web & Flutter Developer. Interactive 3D scroll-driven journey exploring Clinical AI and Offline Mesh Comms." />
  <meta name="twitter:image" content="/og-preview.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>

  <!-- ─── Loader ─── -->
  <div id="loader" aria-live="polite" role="status">
    <div class="loader-content">
      <div class="loader-spinner"></div>
      <p>Loading…</p>
    </div>
  </div>

  <!-- ─── Animated scroll experience ─── -->
  <main id="main-content">

    <!-- Scene 1 : Intro -->
    <section id="scene-intro" class="scene" aria-label="Introduction">
      <div class="intro-content">
        <div class="intro-profile">
          <img
            src="/assets/profile.jpg"
            alt="Ashwin's profile photo"
            onerror="this.style.display='none'"
          />
          <div class="intro-profile-placeholder" aria-hidden="true">A</div>
        </div>
        <h1 class="intro-name">Ashwin Kumaar B</h1>
        <p class="intro-tagline">Building tech that helps people make better decisions.</p>
      </div>
      <div class="scroll-hint" aria-hidden="true">
        <span>Scroll</span>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M19 12l-7 7-7-7"/>
        </svg>
      </div>
    </section>

    <!-- Scene 2 : Square-flip transition -->
    <section id="scene-flip" class="scene" aria-label="Transition">
      <div class="flip-grid" id="flip-grid">
        <!-- tiles generated by flip.js -->
      </div>
    </section>

    <!-- Scene 3 : Silhouette run  (Phase 2) -->
    <section id="scene-run" class="scene" aria-label="About and Skills">
      <div class="scene-placeholder">Scene 3 — Silhouette Run (Phase 2)</div>
    </section>

    <!-- Scene 4 : City chase  (Phase 2) -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <clipPath id="cityPanes" clipPathUnits="objectBoundingBox"></clipPath>
      </defs>
    </svg>
    <section id="scene-city" class="scene" aria-label="Experience and Highlights">
      <div class="scene-placeholder">Scene 4 — City Chase (Phase 2)</div>
    </section>

    <!-- Scene 5 : Rocket launch  (Phase 3) -->
    <div class="portal-under">
      <section id="scene-rocket" class="scene" aria-label="Rocket Launch">
        <div class="scene-placeholder">Scene 5 — Rocket Launch (Phase 3)</div>
      </section>
    </div>

    <!-- Scene: Space / Achievements -->
    <section id="scene-space" class="scene" aria-label="Achievements" style="background:#000;position:relative;height:100svh;">
    </section>

    <!-- Scene 6 : Moon  (Phase 3) -->
    <section id="scene-moon" class="scene" aria-label="Moon Surface">
      <div class="scene-placeholder">Scene 6 — Moon (Phase 3)</div>
    </section>

    <!-- Footer Contact (Flush after Moon scene) -->
    <footer id="contact" role="contentinfo">
      <div class="contact-container">
        <div class="contact-reveal contact-label">// CONTACT</div>
        <h2 class="contact-reveal contact-headline">Let's build something.</h2>
        <div class="contact-reveal contact-links">
          <div class="contact-email-wrapper">
            <a href="mailto:ashwinkumaar.bk@gmail.com" class="contact-link" aria-label="Send email to ashwinkumaar.bk@gmail.com">EMAIL ✉</a>
            <button type="button" class="contact-copy-btn" aria-label="Copy email address to clipboard">Copy</button>
          </div>
          <a href="https://www.linkedin.com/in/ashwin-kumaar-b-16271932b/" target="_blank" rel="noopener noreferrer" class="contact-link" aria-label="Visit LinkedIn profile">LINKEDIN ↗</a>
          <a href="https://github.com/ashwin-kumaar-b" target="_blank" rel="noopener noreferrer" class="contact-link" aria-label="Visit GitHub profile">GITHUB ↗</a>
        </div>
        <div class="contact-reveal contact-location">
          <span aria-hidden="true">📍</span>
          <span>Chennai, India</span>
        </div>
      </div>
    </footer>
  </main>

  <!-- ─── Reduced-motion static fallback (Phase 4) ─── -->
  <main id="static-content" class="reduced-motion-content" hidden aria-label="Portfolio content (static layout)">
  </main>

  <script type="module">
    import { CONTACT } from '/src/config.js';

    function setupCopyButton(btn, email) {
      if (!btn) return;
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        navigator.clipboard.writeText(email).then(() => {
          btn.textContent = 'Copied';
          btn.classList.add('is-copied');
          setTimeout(() => {
            btn.textContent = 'Copy';
            btn.classList.remove('is-copied');
          }, 2000);
        }).catch(() => {
          btn.textContent = 'Copied';
          setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
        });
      });
    }

    function syncFooterWithConfig(footerEl) {
      if (!footerEl) return;
      if (CONTACT.headline) {
        const headlineEl = footerEl.querySelector('.contact-headline');
        if (headlineEl) headlineEl.textContent = CONTACT.headline;
      }
      if (CONTACT.email) {
        const emailLink = footerEl.querySelector('.contact-email-wrapper .contact-link');
        if (emailLink) {
          emailLink.href = `mailto:${CONTACT.email}`;
          emailLink.setAttribute('aria-label', `Send email to ${CONTACT.email}`);
        }
      }
      if (CONTACT.linkedin) {
        const linkedinLink = footerEl.querySelector('a[aria-label*="LinkedIn"]');
        if (linkedinLink) linkedinLink.href = CONTACT.linkedin;
      }
      if (CONTACT.github) {
        const githubLink = footerEl.querySelector('a[aria-label*="GitHub"]');
        if (githubLink) githubLink.href = CONTACT.github;
      }
      const linksContainer = footerEl.querySelector('.contact-links');
      if (linksContainer && CONTACT.resume && CONTACT.resume.trim() !== '' && CONTACT.resume.trim() !== '#') {
        let resumeLink = footerEl.querySelector('a[download]');
        if (!resumeLink) {
          resumeLink = document.createElement('a');
          resumeLink.href = CONTACT.resume;
          resumeLink.download = '';
          resumeLink.className = 'contact-link';
          resumeLink.textContent = 'RESUME ↓';
          resumeLink.setAttribute('aria-label', 'Download Resume');
          linksContainer.appendChild(resumeLink);
        } else {
          resumeLink.href = CONTACT.resume;
        }
      }
      if (CONTACT.location) {
        const locSpan = footerEl.querySelector('.contact-location span:last-child');
        if (locSpan) locSpan.textContent = CONTACT.location;
      }

      const copyBtn = footerEl.querySelector('.contact-copy-btn');
      setupCopyButton(copyBtn, CONTACT.email);
    }

    function initContact() {
      const footer = document.getElementById('contact');
      if (footer) {
        syncFooterWithConfig(footer);

        const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const revealItems = footer.querySelectorAll('.contact-reveal');

        if (prefersReduced) {
          revealItems.forEach(el => el.classList.add('revealed'));
        } else {
          const observer = new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                revealItems.forEach((el, index) => {
                  setTimeout(() => {
                    el.classList.add('revealed');
                  }, index * 60);
                });
                obs.unobserve(entry.target);
              }
            });
          }, { threshold: 0.2 });

          observer.observe(footer);
        }
      }

      // Reduced-motion static layout (#static-content) support
      const staticEl = document.getElementById('static-content');
      if (staticEl) {
        const ensureStaticFooter = () => {
          if (!staticEl.hasAttribute('hidden') && !staticEl.querySelector('footer')) {
            if (footer) {
              const clone = footer.cloneNode(true);
              clone.querySelectorAll('.contact-reveal').forEach(el => el.classList.add('revealed'));
              syncFooterWithConfig(clone);
              staticEl.appendChild(clone);
            }
          }
        };

        const mutationObs = new MutationObserver(ensureStaticFooter);
        mutationObs.observe(staticEl, { attributes: true, childList: true });
        ensureStaticFooter();
      }

      // Smooth scroll for any nav links targeting #contact
      document.querySelectorAll('a[href="#contact"]').forEach((link) => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          const target = document.getElementById('contact');
          if (target) {
            target.scrollIntoView({ behavior: 'smooth' });
          }
        });
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initContact);
    } else {
      initContact();
    }
  </script>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
